name: Package checks

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
      PRIVATE_COMPOSER_URL: ${{ vars.PRIVATE_COMPOSER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, mbstring, openssl, curl, bcmath, sqlite, pdo_sqlite
          coverage: none
      - run: composer validate --strict
      - name: Configure private Composer repository
        if: ${{ env.PRIVATE_COMPOSER_URL != '' }}
        run: composer config --global repositories.fayne composer "$PRIVATE_COMPOSER_URL"
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
      - run: composer format
